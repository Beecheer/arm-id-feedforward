[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arm-id-feedforward"
version = "0.1.0"
description = "Host-side trajectory design, identification and inverse-dynamics feedforward for the EGA seven-axis arm"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pin>=4.1,<4.2",
    "pyserial>=3.5,<4",
    "scipy>=1.14",
]

[project.optional-dependencies]
identify = ["figaroh>=1.0,<2", "cyipopt>=1.7.0", "ndcurves>=2.3,<2.4"]
preview = ["mujoco>=3.3,<4", "imageio>=2.35,<3", "pillow>=10,<13"]

[project.scripts]
arm-id-host = "arm_id_feedforward.arm_host:main"
arm-id-workflow = "arm_id_feedforward.arm_workflow:main"
arm-id-feedforward = "arm_id_feedforward.arm_feedforward:main"
arm-id-plan = "arm_id_feedforward.arm_plan:main"
arm-id-preview = "arm_id_feedforward.arm_sim:main"
arm-id-collect = "arm_id_feedforward.arm_collect:main"
arm-id-collect-more = "arm_id_feedforward.arm_collect_more:main"
arm-id-validation-curve = "arm_id_feedforward.arm_validation_curve:main"
arm-id-identify = "arm_id_feedforward.cli:identify"
arm-id-identify-many = "arm_id_feedforward.identify_many:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arm_id_feedforward = ["models/controller/*.json", "models/controller/*.urdf", "models/controller/*.xml", "models/controller/*.csv", "models/controller/convex/*.obj", "models/identified/*.json"]
